name: Fix Germany Photo Orientation

on:
  workflow_dispatch:

jobs:
  fix-germany-orientation:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Fix Germany image orientation
        run: node .github/scripts/fix-germany-orientation.js

      - name: Commit corrected Germany images
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "github-actions"
          git add photos/germany/
          if git diff --cached --quiet; then
            echo "No Germany images needed orientation correction"
          else
            git commit -m "Fix Germany image orientation"
            git pull --rebase origin main
            git push
          fi
