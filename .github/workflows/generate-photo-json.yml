name: Generate Photo Gallery JSON

on:
  push:
    paths:
      - 'photos/**'
  workflow_dispatch:

jobs:
  generate-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install sharp library
        run: npm install sharp --save-dev

      - name: Fix image orientation
        run: node .github/scripts/fix-image-orientation.js

      - name: Generate JSON files
        run: node .github/scripts/generate-json.js

     - name: Commit and push changes
  run: |
    git config --local user.email "github-actions@github.com"
    git config --local user.name "github-actions"
    git add photos/ *.json
    if git diff --cached --quiet; then
      echo "No changes to commit"
    else
      git commit -m "Fix image orientation and auto-generate photo gallery JSON"
      git pull --rebase origin main
      git push
    fi
