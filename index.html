<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hammock photos</title>
  <meta name="description" content="Jim and Jennifer Hammock's photos, kept in one place for family and friends.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&display=swap">
  <link rel="stylesheet" href="album.css">
</head>
<body>
  <header class="top">
    <a class="mark" href="index.html">hammock<span>.ltd</span></a>
    <nav aria-label="Main">
      <a href="#years">Places</a>
      <a href="genealogy.html">Family tree</a>
      <button type="button" data-slideshow>Slideshow</button>
    </nav>
  </header>

  <main>
    <div class="wrap">
      <figure class="hero">
        <div class="hero-frame"><img id="heroImg" alt=""></div>
        <figcaption class="hero-bar">
          <p class="hero-cap" id="heroCap">Loading a photo</p>
          <span class="hero-actions">
            <button class="btn quiet" type="button" id="another">Show another</button>
            <button class="btn" type="button" data-slideshow>Play slideshow</button>
          </span>
        </figcaption>
      </figure>

      <p class="intro">Jim and Jennifer Hammock's photos, kept in one place for family and friends.</p>
      <p class="intro-sub"><span id="count">Photos</span>. Pick a year, pick a place, or let the slideshow run on the TV.</p>

      <div class="years" id="years"></div>

      <section class="az" aria-labelledby="azh">
        <h2 id="azh">Every place, A to Z</h2>
        <ul id="az"></ul>
      </section>
    </div>
  </main>

  <footer class="foot">
    <span>Want a full-size copy of a photo? Email <a href="mailto:jim@hammock.ltd">jim@hammock.ltd</a></span>
    <a href="genealogy.html">Family tree</a>
  </footer>

  <script src="album.js"></script>
  <script>Album.start('home');</script>
</body>
</html>
