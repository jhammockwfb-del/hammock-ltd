<style>
:root {
  /* Light mode */
  --bg-primary: #fefefe;
  --bg-secondary: #f9f7f4;
  --text-primary: #2d2d2d;
  --text-secondary: #5a5a5a;
  --accent-primary: #dc2626;
  --accent-secondary: #2563eb;
  --accent-light: #fce7f3;
  --shadow-sm: 0 2px 8px rgba(220, 38, 38, 0.1);
  --shadow-md: 0 4px 16px rgba(220, 38, 38, 0.15);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-primary: #1a1a1a;
    --bg-secondary: #2d2d2d;
    --text-primary: #f5f5f5;
    --text-secondary: #d0d0d0;
    --accent-primary: #f87171;
    --accent-secondary: #60a5fa;
    --accent-light: #fce7f3;
    --shadow-sm: 0 2px 8px rgba(248, 113, 113, 0.2);
    --shadow-md: 0 4px 16px rgba(248, 113, 113, 0.25);
  }
}

:root[data-theme="dark"] {
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --text-primary: #f5f5f5;
  --text-secondary: #d0d0d0;
  --accent-primary: #f87171;
  --accent-secondary: #60a5fa;
  --accent-light: #fce7f3;
  --shadow-sm: 0 2px 8px rgba(248, 113, 113, 0.2);
  --shadow-md: 0 4px 16px rgba(248, 113, 113, 0.25);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  background-color: var(--bg-primary);
  color: var(--text-primary);
  font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
  line-height: 1.6;
  font-size: 16px;
}

/* Typography */
h1, h2, h3 {
  font-family: 'Playfair Display', Georgia, serif;
  font-weight: 700;
  line-height: 1.2;
  text-wrap: balance;
}
</style>
